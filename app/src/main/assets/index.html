<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>Inam Ali Online Platforms</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:"Noto Nastaliq Urdu","Noto Sans Arabic",Arial,sans-serif}header{background:linear-gradient(135deg,#0a2347,#1265bd);padding:25px 18px 20px;border-radius:0 0 24px 24px}header small{color:#c8e1ff}h1{font-size:25px;margin:8px 0}header p{margin:5px 0 15px;color:#d6e9ff}.search{width:100%;padding:13px 15px;border:1px solid #41658f;border-radius:13px;background:#fff;color:#14243b;font-size:16px}.wrap{padding:16px;max-width:850px;margin:auto}.welcome{background:#102b4e;border:1px solid #244b76;padding:16px;border-radius:18px;margin-bottom:16px}.welcome h2{margin:0 0 6px;font-size:19px}.muted{color:#a9bdd7;font-size:14px}.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.chip,button{border:0;border-radius:11px;padding:10px 14px;background:#174477;color:#fff;font-size:14px;white-space:nowrap}.chip.active,button.primary{background:#2384ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.card{background:#10233e;border:1px solid #203e60;border-radius:16px;padding:14px;min-height:104px;text-align:right;color:#fff;width:100%;white-space:normal}.card b{display:block;font-size:16px;margin-bottom:6px}.card span{color:#a9bdd7;font-size:12px}.section-title{font-size:19px;margin:18px 0 10px}.bar{height:7px;background:#203b5a;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#35a0ff;width:0}.panel{background:#10233e;border:1px solid #203e60;border-radius:16px;padding:16px;margin-top:12px}.lesson{padding:12px 0;border-bottom:1px solid #29425f}.lesson:last-child{border:0}.lesson button{margin-top:8px}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#1b3452}.tabs button.active{background:#2384ed}a{color:#7dbbff;overflow-wrap:anywhere}footer{text-align:center;color:#8098b5;padding:25px;font-size:12px}
</style></head><body>
<header><small>آن لائن کمائی سیکھنے کی مکمل اکیڈمی</small><h1>Inam Ali Online Platforms</h1><p>سیکھیں، مشق کریں اور اپنی ڈیجیٹل مہارتیں بہتر بنائیں۔</p><input id="search" class="search" placeholder="کورس تلاش کریں… (مثلاً Facebook، فری لانسنگ)"></header>
<main class="wrap"><section class="welcome"><h2>خوش آمدید!</h2><div class="muted">اپنی پسند کا کورس منتخب کریں اور مرحلہ وار سیکھنا شروع کریں۔ تمام اسباق اردو میں ہیں۔</div><div class="bar"><i id="progress"></i></div><div class="muted" id="progressText">0 اسباق مکمل</div></section>
<div class="tabs"><button class="active" data-tab="courses">تمام کورسز</button><button data-tab="saved">محفوظ کورسز</button><button data-tab="done">مکمل اسباق</button></div>
<div class="chips" id="categories"></div><h2 class="section-title" id="heading">کورسز</h2><div class="grid" id="courseGrid"></div><section id="detail" class="panel hidden"></section><footer>Inam Ali Online Platforms • سیکھنا جاری رکھیں</footer></main>
<script>
const groups=[
["سوشل میڈیا",["Facebook","TikTok","YouTube","Instagram","Snapchat","Pinterest","LinkedIn","X / Twitter","Telegram","WhatsApp Business"]],
["افیلی ایٹ اور ای کامرس",["Affiliate Marketing","Amazon Affiliate","Daraz Affiliate","Shopify","Dropshipping","E-commerce","Digital Products","Print on Demand","Etsy","Blogging"]],
["مصنوعی ذہانت",["ChatGPT","Google Gemini","Canva AI","CapCut AI","AI Video Generation","AI Voice Generation","AI Automation","AI Content Creation","AI Image Generation","No-Code Tools"]],
["ویڈیو اور مواد",["Video Editing","CapCut","VN Editor","YouTube Shorts","Facebook / Instagram Reels","Documentary Making","Voice Over","Podcasting","Thumbnail Creation","Content Writing"]],
["فری لانسنگ",["Fiverr","Upwork","Freelancer.com","PeoplePerHour","Virtual Assistant","Data Entry","Translation","Transcription","Online Tutoring","Website Development"]],
["ڈیجیٹل مارکیٹنگ",["SEO","Email Marketing","Social Media Management","Content Marketing","Website Monetization","Online Advertising"]],
["آن لائن خدمات",["Stock Photography","Online Courses Creation","Newsletter Business","UGC Content Creation","App Development","Web Design","Online Research Services","Digital Services"]],
["ادائیگیاں اور رقم نکلوانا",["Payoneer","PayPal اور ملک کی دستیابی","پاکستانی بینک اکاؤنٹ","Wise","Skrill"]]
];
const courses=groups.flatMap(([cat,names])=>names.map(name=>({cat,name})));
const state={saved:JSON.parse(localStorage.saved||"[]"),done:JSON.parse(localStorage.done||"[]"),cat:"سب",tab:"courses"};
const $=id=>document.getElementById(id);
function persist(){localStorage.saved=JSON.stringify(state.saved);localStorage.done=JSON.stringify(state.done);$("progressText").textContent=state.done.length+" اسباق مکمل";$("progress").style.width=Math.min(100,state.done.length/Math.max(1,courses.length*3)*100)+"%"}
function drawCats(){ $("categories").innerHTML=["سب",...groups.map(x=>x[0])].map(c=>'<button class="chip '+(state.cat===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;drawCats();draw()})}
function draw(){let q=$("search").value.trim().toLowerCase();let list=courses.filter(c=>(state.cat==="سب"||c.cat===state.cat)&&(!q||(c.name+" "+c.cat).toLowerCase().includes(q)));if(state.tab==="saved")list=list.filter(c=>state.saved.includes(c.name));if(state.tab==="done")list=list.filter(c=>[1,2,3].some(n=>state.done.includes(c.name+"-"+n)));$("heading").textContent=state.tab==="saved"?"محفوظ کورسز":state.tab==="done"?"آپ کی پیش رفت":"کورسز ("+list.length+")";$("courseGrid").innerHTML=list.map(c=>'<button class="card" data-course="'+c.name+'"><b>'+c.name+'</b><span>'+c.cat+'</span><div class="muted">'+(state.saved.includes(c.name)?"★ محفوظ":"کورس کھولیں")+'</div></button>').join("")||'<div class="muted">کوئی کورس نہیں ملا۔</div>';document.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>openCourse(b.dataset.course))}
function openCourse(name){let c=courses.find(x=>x.name===name);$("detail").classList.remove("hidden");$("detail").innerHTML='<h2>'+name+'</h2><div class="muted">'+c.cat+'</div><p>اس کورس کو مرحلہ وار سیکھیں۔ پہلے بنیادی معلومات سمجھیں، پھر مشق کریں اور اپنی مہارت کا جائزہ لیں۔</p><button id="save">'+(state.saved.includes(name)?"★ محفوظ ہے":"☆ محفوظ کریں")+'</button><div class="tabs"><button class="active">ابتدائی</button><button>درمیانی</button><button>ماہر</button></div>'+["ابتدائی","درمیانی","ماہر"].map((level,i)=>'<div class="lesson"><b>'+level+' سطح</b><p class="muted">'+(i===0?"تعارف، بنیادی اصطلاحات، اکاؤنٹ اور حفاظتی اصول۔":i===1?"عملی طریقے، مواد یا پروفائل بہتر بنانا، اور عام غلطیوں سے بچاؤ۔":"اپنا مکمل پروجیکٹ، نتائج کا جائزہ، پالیسیوں کی پابندی اور اگلے مراحل۔")+'</p><button data-done="'+(i+1)+'">'+(state.done.includes(name+"-"+(i+1))?"مکمل ✓":"سبق مکمل کریں")+'</button></div>').join("")+'<p class="muted">نوٹ: ہر پلیٹ فارم کی عمر، ملک، کمائی اور ادائیگی کی شرائط مختلف ہو سکتی ہیں۔ تازہ شرائط ہمیشہ اس پلیٹ فارم کی سرکاری ویب سائٹ سے چیک کریں۔ کمائی کی ضمانت نہیں ہوتی۔</p><p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+" Urdu tutorial 2025 2026")+'">YouTube پر اردو ویڈیوز تلاش کریں ↗</a></p>';
$("save").onclick=()=>{state.saved=state.saved.includes(name)?state.saved.filter(x=>x!==name):[...state.saved,name];persist();openCourse(name);draw()};document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{let id=name+"-"+b.dataset.done;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];persist();openCourse(name);draw()});$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
$("search").addEventListener("input",draw);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));draw()});drawCats();persist();draw();
</script></body></html>
